# WeighingMS 1.0.0: production stack for one station or site server (brief.md A-11, unconfirmed).
# Image-only: run `docker load` on the release tarballs first (see deploy/README.md). Nothing is built here.
#
#   docker compose --env-file production.env -f docker-compose.prod.yml up -d --wait
#
# NOT PRODUCTION-READY in 1.0.0: in the Production environment no station users exist, so nobody can
# sign in (OPS-PROD-USERS). See deploy/README.md → Known blockers.
name: weighingms

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weighingms}
      POSTGRES_USER: ${POSTGRES_USER:-weighingms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in production.env}
    # No host port: only the Api reaches the database, on the Compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  # The dummy OrgaTEX, scales, scanner and printer. They stand in until the real devices and OrgaTEX
  # are integrated (training contracts, not the real interfaces). Outside Development their /_sim/*
  # control endpoints and Scalar UI are off. No host port: only the Api calls them.
  simulators:
    image: weighingms/simulators:${WMS_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5090
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5090/api/scales > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrator:
    image: weighingms/migrator:${WMS_VERSION:-1.0.0}
    restart: "no"
    environment:
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${POSTGRES_DB:-weighingms};Username=${POSTGRES_USER:-weighingms};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: weighingms/api:${WMS_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5080
      # Behind the TLS reverse proxy Kestrel sees plain HTTP. Antiforgery runs with SecurePolicy=Always and
      # throws (500) on a request it doesn't see as HTTPS, so the Api must trust X-Forwarded-Proto from the
      # proxy (OPS-FORWARDED-HEADERS). Safe only because the port is bound to 127.0.0.1 below.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${POSTGRES_DB:-weighingms};Username=${POSTGRES_USER:-weighingms};Password=${POSTGRES_PASSWORD}
      Integrations__Simulators__BaseUrl: http://simulators:5090
      Station__StationId: ${STATION_ID:-STATION 01}
      Station__TimeZone: ${STATION_TIME_ZONE:-Asia/Dhaka}
    # Bound to the loopback interface: put a TLS reverse proxy in front (the cookies are Secure, __Host-).
    ports:
      - "127.0.0.1:${API_PORT:-5080}:5080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      simulators:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5080/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
